search:
  keywords:
    - secondary button
    - supporting action
    - secondary action
  natural_language_queries:
    - bouton secondaire
    - bouton pour une action complémentaire
    - action de soutien dans une page
  tags:
    - button-hierarchy
    - supporting-action
    - moderate-emphasis

ai:
  short_prompt: >
    Utilise un Secondary Button pour une action utile mais moins prioritaire.
  detailed_prompt: >
    Ajoute un Secondary Button pour une action complémentaire à l'action principale.
    Donne-lui une emphase visuelle modérée, un libellé explicite, un focus visible,
    un contraste suffisant et les états default, hover, focus, pressed, disabled et
    loading. Vérifie qu'il reste identifiable sans concurrencer l'action principale.