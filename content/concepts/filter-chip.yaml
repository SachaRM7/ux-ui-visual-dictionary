ai:
  short_prompt: >
    Utilise des Filter Chips pour exposer les filtres rapides et fréquemment
    utilisés. Permets une sélection multiple et rends clairement visible l'état
    actif de chaque filtre.
  detailed_prompt: >
    Ajoute une rangée de Filter Chips sous la barre de recherche pour les critères
    de filtrage les plus fréquemment utilisés. Autorise la sélection multiple et
    mets à jour les résultats immédiatement après chaque activation ou désactivation.
    Affiche clairement les états default, hover, focus, active, selected et disabled.
    Les labels doivent être courts et explicites. L'état selected ne doit pas dépendre
    uniquement de la couleur : utilise également un indicateur suffisamment clair.
    Assure une navigation clavier correcte, un focus visible et une zone tactile suffisante.

