id: ghost-button
canonical_name: Ghost Button
slug: ghost-button
status: pilot
interactive: true

aliases: []
alternative_names: []

category:
  primary: ui-components
  secondary: actions
  tertiary: buttons

short_definition: Button à faible emphase visuelle, généralement sans surface pleine.
definition: >
  Un Ghost Button est une variante de Button dont la surface est peu ou pas
  remplie au repos, afin de proposer une action secondaire ou contextuelle avec
  une empreinte visuelle réduite. Sa lisibilité et ses états doivent rester clairs.
purpose: >
  Donner accès à une action sans ajouter une surface dominante dans une interface
  déjà dense ou visuellement hiérarchisée.
user_goal: >
  Reconnaître une action disponible même lorsque son traitement visuel est discret.
problem_solved: >
  Limiter le bruit visuel des actions secondaires tout en conservant une interaction
  explicite et accessible.

use_when:
  - L'action est secondaire ou contextuelle.
  - L'interface possède déjà une action fortement mise en avant.
  - Une surface pleine ajouterait une emphase disproportionnée.
  - Le contraste du texte, du focus et des états reste suffisant.
avoid_when:
  - L'action est l'action principale de la page.
  - Le fond ou le contexte rend la limite du contrôle difficile à percevoir.
  - La discrétion risque de faire croire que le contrôle est un simple lien ou du texte.
  - Le contraste ou l'état actif ne peut pas être rendu clairement.

variants:
  - id: with-icon
    name: With Icon
    description: Ghost Button accompagné d'une icône qui clarifie l'action.
  - id: compact
    name: Compact
    description: Ghost Button réduit pour un contexte dense, sans compromettre la cible tactile.

states:
  - id: default
    name: Default
    description: Action discrète disponible dans son état de repos.
  - id: hover
    name: Hover
    description: État ajoutant un retour visuel au survol.
  - id: focus
    name: Focus
    description: État de focus visible indépendamment de la surface du bouton.
  - id: pressed
    name: Pressed
    description: État bref indiquant l'activation du contrôle.
  - id: disabled
    name: Disabled
    description: Action indisponible avec une apparence non ambiguë.
  - id: loading
    name: Loading
    description: Action discrète en cours de traitement.

selection_model:
  type: none
  min_selection: 0
  max_selection: 0
interaction_model:
  trigger: click_or_tap
  activation: invoke_action
  deactivation: not_applicable
  immediate_effect: true
  requires_confirmation: false
accessibility:
  semantic_role: button
  native_element: button
  keyboard:
    - Tab
    - Enter
    - Space
  focus: visible
  contrast: required
  target_size: required
  color_independence: required

relationships:
