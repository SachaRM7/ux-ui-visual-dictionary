    - ghost button
    - borderless button
    - low emphasis action
  natural_language_queries:
    - bouton discret sans fond
    - bouton sans surface pour une action secondaire
    - action secondaire avec faible emphase visuelle
  tags:
    - low-emphasis
    - borderless-surface
    - secondary-action

ai:
  short_prompt: >
    Utilise un Ghost Button pour une action secondaire à faible emphase visuelle.
  detailed_prompt: >
    Ajoute un Ghost Button uniquement pour une action secondaire ou contextuelle.
    Évite une surface pleine au repos, mais conserve un contraste suffisant, un
    focus visible, des états hover et pressed lisibles, une cible tactile adéquate
    et un libellé qui ne dépend pas de la couleur ou de la bordure seule.