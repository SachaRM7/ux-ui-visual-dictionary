    - icon button
    - icon-only button
    - symbol action
  natural_language_queries:
    - bouton avec seulement une icône
    - bouton icône sans texte visible
    - action représentée par une icône
  tags:
    - icon-only
    - compact-action
    - accessible-label

ai:
  short_prompt: >
    Utilise un Icon Button seulement lorsque l'icône rend l'action reconnaissable.
  detailed_prompt: >
    Ajoute un Icon Button pour une action compacte et reconnaissable. Fournis un
    nom accessible explicite, un focus visible, une cible tactile suffisante, des
    états default, hover, focus, pressed, disabled et loading, ainsi qu'une aide
    contextuelle si le symbole seul n'est pas assez évident. Ne dépends jamais de
    l'icône seule pour communiquer une action critique ou ambiguë.