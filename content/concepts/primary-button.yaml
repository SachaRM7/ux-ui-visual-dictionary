search:
  keywords:
    - primary button
    - main action
    - action hierarchy
  natural_language_queries:
    - bouton principal
    - bouton pour l'action principale
    - action prioritaire dans une page
  tags:
    - button-hierarchy
    - prominent-action
    - visual-priority

ai:
  short_prompt: >
    Utilise un Primary Button uniquement pour l'action principale du contexte.
  detailed_prompt: >
    Utilise un Primary Button pour mettre en évidence une seule action principale.
    Conserve un libellé explicite, un contraste suffisant, un focus visible et les
    états default, hover, focus, pressed, disabled et loading. Vérifie que les
    autres actions disposent d'une emphase visuelle inférieure et que la hiérarchie
    ne repose pas uniquement sur la couleur.