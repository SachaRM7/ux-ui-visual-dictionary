    - contrôle pour lancer une action
    - bouton d'action
  tags:
    - ui-components
    - actions
    - interaction
    - control

ai:
  short_prompt: >
    Utilise un Button avec un libellé explicite pour déclencher l'action attendue.
  detailed_prompt: >
    Ajoute un Button sémantique pour l'action attendue, avec un libellé explicite,
    une hiérarchie visuelle adaptée au contexte, des états default, hover, focus,
    pressed, disabled et loading, un focus visible, une taille de cible suffisante
    et une activation correcte au clavier.